name: Deploy Render release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag to deploy (for example, v0.2.0)
        required: true
        type: string
      services:
        description: Which Render service(s) to deploy
        required: true
        type: choice
        options:
          - api
          - web
          - both

permissions:
  contents: read

jobs:
  resolve-release:
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.resolve.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: resolve
        name: Resolve release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ! git check-ref-format "refs/tags/$RELEASE_TAG"; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          commit_sha="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"
          echo "Selected $RELEASE_TAG at $commit_sha"

  deploy:
    needs: resolve-release
    runs-on: ubuntu-latest
    steps:
      - name: Trigger API deploy
        if: inputs.services == 'api' || inputs.services == 'both'
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_API_DEPLOY_HOOK_URL }}
          RELEASE_SHA: ${{ needs.resolve-release.outputs.commit_sha }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "Missing RENDER_API_DEPLOY_HOOK_URL repository secret." >&2
            exit 1
          fi
          curl --fail --silent --show-error --output /dev/null \
            --get --data-urlencode "ref=$RELEASE_SHA" "$DEPLOY_HOOK_URL"
          echo "Render accepted the API deploy for $RELEASE_SHA."

      - name: Trigger web deploy
        if: inputs.services == 'web' || inputs.services == 'both'
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_WEB_DEPLOY_HOOK_URL }}
          RELEASE_SHA: ${{ needs.resolve-release.outputs.commit_sha }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "Missing RENDER_WEB_DEPLOY_HOOK_URL repository secret." >&2
            exit 1
          fi
          curl --fail --silent --show-error --output /dev/null \
            --get --data-urlencode "ref=$RELEASE_SHA" "$DEPLOY_HOOK_URL"
          echo "Render accepted the web deploy for $RELEASE_SHA."
