services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flowboard
      POSTGRES_USER: flowboard
      POSTGRES_PASSWORD: flowboard
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flowboard -d flowboard']
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://flowboard:flowboard@db:5432/flowboard?schema=public
      PORT: 3000
      WEB_ORIGIN: http://localhost:8080
      FLOWBOARD_DEMO_MODE: 'true'
      JWT_ISSUER: flowboard-local
      JWT_AUDIENCE: flowboard-web
      JWT_SECRET_FILE: /run/flowboard-secrets/jwt-secret
      SEED_PASSWORD: ${SEED_PASSWORD:-FlowboardDemo!2026}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '3000:3000'
    volumes:
      - signing_material:/run/flowboard-secrets
    networks: [internal, edge]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on: [api]
    ports: ['8080:8080']
    networks: [edge]

volumes:
  postgres_data:
  signing_material:

networks:
  internal:
    internal: true
  edge:
