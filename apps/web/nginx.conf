server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  location / { try_files $uri $uri/ /index.html; }
  location /v1/ {
    proxy_pass ${API_UPSTREAM};
    proxy_set_header Host $proxy_host;
    proxy_ssl_server_name on;
  }
  location /docs {
    proxy_pass ${API_UPSTREAM};
    proxy_set_header Host $proxy_host;
    proxy_ssl_server_name on;
  }
  location = /docs-json {
    proxy_pass ${API_UPSTREAM};
    proxy_set_header Host $proxy_host;
    proxy_ssl_server_name on;
  }
}
