server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  location / { try_files $uri $uri/ /index.html; }
  location /v1/ { proxy_pass http://api:3000; proxy_set_header Host $host; }
  location /docs { proxy_pass http://api:3000; proxy_set_header Host $host; }
  location = /docs-json { proxy_pass http://api:3000; proxy_set_header Host $host; }
}
